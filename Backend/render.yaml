# Import this file as a Render Blueprint. PostgreSQL is supplied separately by Supabase.
services:
  - type: web
    name: fraudlens-backend
    runtime: node
    plan: free
    rootDir: Backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run prisma:deploy && npm run start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
