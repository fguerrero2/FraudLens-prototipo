services:
  - type: web
    name: fraudlens-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: PORT
        value: 3000
      - key: CORS_ORIGIN
        sync: false
      - key: CLIENT_API_KEY
        sync: false
      - key: ANALYST_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
